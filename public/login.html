<!DOCTYPE html>
<html>
<head>
  <title>LECO - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-dark: #1e40af;
      --text-primary: #e2e8f0;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --bg-primary: #1e293b;
      --bg-secondary: #0f172a;
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-primary);
    }
    
    .container {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.4);
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }
    
    h1 {
      text-align: center;
      color: var(--text-primary);
      margin-bottom: 8px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 14px;
      font-weight: 400;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    
    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      font-size: 14px;
      color: var(--text-primary);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      outline: none;
      background: rgba(15, 23, 42, 0.8);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    input[type="text"]::placeholder,
    input[type="password"]::placeholder,
    input[type="email"]::placeholder {
      color: var(--text-muted);
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 0.5rem;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    button:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      background: rgba(59, 130, 246, 0.05);
      border-color: rgba(59, 130, 246, 0.15);
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }
    
    .toggle-link {
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    .toggle-link a {
      color: #93c5fd;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .toggle-link a:hover {
      color: var(--text-primary);
      text-decoration: underline;
    }
    
    .message {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 0.5rem;
      text-align: center;
      display: none;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .message.error {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: block;
    }
    
    .message.success {
      background: rgba(16, 185, 129, 0.1);
      color: #86efac;
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: block;
    }
    
    .demo-users {
      background: rgba(15, 23, 42, 0.4);
      border-left: 3px solid rgba(59, 130, 246, 0.3);
      padding: 16px;
      margin-top: 24px;
      border-radius: 0.5rem;
      font-size: 12px;
      color: var(--text-muted);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .demo-users strong {
      display: block;
      margin-bottom: 10px;
      color: #93c5fd;
      font-weight: 600;
      font-size: 13px;
    }
    
    .demo-user {
      margin-bottom: 8px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-muted);
      line-height: 1.6;
    }
    
    h2 {
      font-size: 18px;
      margin-bottom: 24px;
      color: var(--text-primary);
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    
    small {
      color: var(--text-muted);
      font-size: 11px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 style="font-weight: bold;">LECO</h1>
  <p class="subtitle">Secure Meter Reading Image Management</p>
  
  <div id="message" class="message"></div>
  
  <!-- Login Form -->
  <div id="loginForm">
    <h2>Login</h2>
    
    <div class="form-group">
      <label for="loginUsername">Username</label>
      <input type="text" id="loginUsername" placeholder="Enter your username" />
    </div>
    
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" />
    </div>
    
    <button onclick="handleLogin()" id="loginBtn">Login</button>
  </div>
  
  <!-- Register Form -->
  <div id="registerForm" style="display:none;">
    <h2>Create Account</h2>
    
    <div class="form-group">
      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" placeholder="Choose a username" />
    </div>
    
    <div class="form-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="Enter your email" />
    </div>
    
    <div class="form-group">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="Create a password" />
    </div>
    
    <div class="form-group">
      <label for="regPasswordConfirm">Confirm Password</label>
      <input type="password" id="regPasswordConfirm" placeholder="Confirm password" />
    </div>
    
    <button onclick="handleRegister()" id="registerBtn">Register</button>
    
    <div class="toggle-link">
      Already have an account? <a onclick="toggleForms()">Login here</a>
    </div>
  </div>
</div>

<script>
function toggleForms() {
  document.getElementById('loginForm').style.display = 
    document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = 
    document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
  clearMessage();
}

function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = `message ${type}`;
  setTimeout(() => {
    msg.className = 'message';
  }, 5000);
}

function clearMessage() {
  document.getElementById('message').className = 'message';
}

function handleLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  
  if (!username || !password) {
    showMessage('Please fill in all fields', 'error');
    return;
  }
  
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';
  
  fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  .then(res => res.json())
  .then(data => {
    console.log('Login response:', data);
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.user.username);
      localStorage.setItem('userId', data.user.id);
      localStorage.setItem('role', data.user.role);
      localStorage.setItem('permissions', JSON.stringify(data.user.permissions));
      console.log('Stored - Role:', data.user.role, 'Permissions:', data.user.permissions);
      showMessage('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    } else {
      showMessage(data.error || 'Login failed', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login';
    }
  })
  .catch(err => {
    showMessage('Network error: ' + err.message, 'error');
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
  });
}

function handleRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value.trim();
  const confirm = document.getElementById('regPasswordConfirm').value.trim();
  
  if (!username || !email || !password || !confirm) {
    showMessage('Please fill in all fields', 'error');
    return;
  }
  
  if (password !== confirm) {
    showMessage('Passwords do not match', 'error');
    return;
  }
  
  if (password.length < 6) {
    showMessage('Password must be at least 6 characters', 'error');
    return;
  }
  
  const registerBtn = document.getElementById('registerBtn');
  registerBtn.disabled = true;
  registerBtn.textContent = 'Registering...';
  
  fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      showMessage('Registration successful! Logging in...', 'success');
      setTimeout(() => {
        document.getElementById('loginUsername').value = username;
        document.getElementById('loginPassword').value = password;
        handleLogin();
      }, 1500);
    } else {
      showMessage(data.error || 'Registration failed', 'error');
      registerBtn.disabled = false;
      registerBtn.textContent = 'Register';
    }
  })
  .catch(err => {
    showMessage('Network error: ' + err.message, 'error');
    registerBtn.disabled = false;
    registerBtn.textContent = 'Register';
  });
}

// Allow Enter key to submit
document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginForm').style.display !== 'none') {
      handleLogin();
    } else {
      handleRegister();
    }
  }
});
</script>

</body>
</html>
